[package]
name = "hybridcipher-provider-core"
version = "0.1.0"
edition = "2021"
authors = ["HybridCipher Team"]
description = "Shared provider boundary for HybridCipher native filesystem integrations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hybridcipher/hybridcipher"
readme = "../../README.md"
keywords = ["cryptography", "filesystem", "provider", "hybridcipher"]
categories = ["cryptography", "filesystem"]

[features]
native-verification = ["dep:hybridcipher-crypto"]

[dependencies]
hybridcipher-crypto = { path = "../crypto", optional = true }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hybridcipher-client = { path = "../client" }
hybridcipher-mount-sync = { path = "../mount-sync" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
zeroize = { workspace = true }
tempfile = "3.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
hybridcipher-crypto = { path = "../crypto" }
tempfile = "3.0"
tokio = { version = "1.0", features = ["macros", "rt", "sync"] }
